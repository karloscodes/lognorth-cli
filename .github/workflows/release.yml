# A tag v* makes a release: the CLI for macOS and Linux, and checksums.txt.
# The test job is the same in chasen, lognorth-cli, and suppyhq-cli. Each
# builds and publishes its own binaries.
#
# Built from the tag, outside this checkout, with the Go version in go.mod.
# The job fails if the worktree is dirty, if a binary was built with another
# Go, or if a tag build is not exactly that module version. Writing the
# binaries into the checkout stamps every build after the first
# vcs.modified, and the module version becomes <tag>+dirty.
name: Release
on:
  push:
    tags: ["v*"]
  # Security release starts it for a tag it pushed: see security-release.yml.
  workflow_dispatch:

# Read only by default: only the job that publishes can write the release.
permissions:
  contents: read

jobs:
  # The same gate as CI, so a tag on a red commit releases nothing. A release
  # is made only from a commit of main.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so the build stamps the tag and not a
          # pseudo-version from a shallow clone.
          fetch-depth: 0
          persist-credentials: false
      - name: The checkout is the tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "GITHUB_REF is $GITHUB_REF, not refs/tags/v*"; exit 1 ;;
          esac
          test "$(git rev-list -n 1 "refs/tags/$GITHUB_REF_NAME")" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          # north update compares this with the tag minus its leading v.
          flags="-s -w -X main.version=${GITHUB_REF_NAME#v}"
          # Outside the checkout. Writing the binaries into the module
          # directory stamps every build after the first vcs.modified,
          # with the module version <tag>+dirty.
          out="${RUNNER_TEMP}/dist"
          mkdir -p "$out"
          test -z "$(git status --porcelain)"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -ldflags "$flags" -o "$out/north-${target%/*}-${target#*/}" .
          done
          mod="$(go list -m)"
          (
            cd "$out"
            sha256sum north-* > checksums.txt
            want="go$(awk '/^go / { print $2; exit }' "$GITHUB_WORKSPACE/go.mod")"
            tab="$(printf '\t')"
            for bin in north-*; do
              info="$(go version -m "$bin")"
              case "$info" in
                "$bin: $want"$'\n'*) ;;
                *) echo "$bin was built with another Go than $want"; printf '%s\n' "$info"; exit 1 ;;
              esac
              case "$info" in
                *"${tab}build${tab}vcs.modified=false"*) ;;
                *) echo "$bin was built from a modified checkout"; printf '%s\n' "$info"; exit 1 ;;
              esac
              case "$info" in
                *"${tab}mod${tab}${mod}${tab}${GITHUB_REF_NAME}${tab}"*) ;;
                *) echo "$bin is not the module version $GITHUB_REF_NAME"; printf '%s\n' "$info"; exit 1 ;;
              esac
            done
            got="$(./north-linux-amd64 version)"
            want_ver="north ${GITHUB_REF_NAME#v}"
            if [ "$got" != "$want_ver" ]; then
              echo "north version is $got, want $want_ver"
              exit 1
            fi
          )
          test -z "$(git status --porcelain)"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a hyphen (v1.5.0-rc.1) is a pre-release, which
          # releases/latest skips: no install or update takes it.
          prerelease=false
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=true; fi
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/dist/* --title "$GITHUB_REF_NAME" --verify-tag --prerelease="$prerelease"
