version: 2
builds:
  - main: .
    binary: north
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
# Plain binaries named north-<os>-<arch>, the names install.sh downloads.
archives:
  - formats: [binary]
    name_template: "north-{{ .Os }}-{{ .Arch }}"
checksum:
  name_template: checksums.txt
changelog:
  disable: true
